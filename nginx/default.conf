# ==============================================================================
# NGINX REVERSE PROXY CONFIGURATION
# Học phần: Triển khai & Quản trị Hệ thống Phần mềm
# Tuân thủ nghiêm ngặt tiêu chuẩn .cursorrules (5 Security Headers & Ingress 80)
# ==============================================================================

server {
    listen 80;
    server_name localhost;

    # Kích hoạt bộ đệm và giới hạn kích thước upload
    client_max_body_size 64M;

    # ==========================================================================
    # 5 SECURITY HEADERS BẮT BUỘC THEO TIÊU CHUẨN OWASP VÀ .CURSORRULES
    # ==========================================================================
    # 1. Chống tấn công Clickjacking và nhúng iframe trái phép
    add_header X-Frame-Options "SAMEORIGIN" always;

    # 2. Phòng chống Cross-Site Scripting (XSS)
    add_header X-XSS-Protection "1; mode=block" always;

    # 3. Chống MIME-type sniffing
    add_header X-Content-Type-Options "nosniff" always;

    # 4. Kiểm soát thông tin nguồn gốc gửi kèm trong HTTP referrer
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # 5. Chính sách an toàn nội dung (Content Security Policy)
    add_header Content-Security-Policy "default-src 'self' 'unsafe-inline' 'unsafe-eval' https://fonts.googleapis.com https://fonts.gstatic.com data:;" always;

    # ==========================================================================
    # REVERSE PROXY - ĐỊNH TUYẾN ỨNG DỤNG QUIZ (NODE.JS EXPRESS)
    # ==========================================================================
    location / {
        proxy_pass http://quiz_app:3000;
        proxy_http_version 1.1;

        # Thiết lập HTTP headers chuyển tiếp cho ứng dụng phía sau
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Cấu hình WebSocket (nếu cần mở rộng)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # ==========================================================================
    # REVERSE PROXY - ĐỊNH TUYẾN HỆ QUẢN TRỊ PHPMYADMIN
    # ==========================================================================
    location /phpmyadmin/ {
        proxy_pass http://phpmyadmin:80/;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Chuyển tiếp HTTP headers
        proxy_redirect off;
    }

    # Trang báo lỗi tiêu chuẩn
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
